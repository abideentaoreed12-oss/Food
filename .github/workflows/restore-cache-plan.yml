name: restore-cache-plan
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Restore verifyToken on main
        run: python3 scripts/apply_fix_verify_token.py
      - name: Commit on main
        run: |
          set -e
          git config user.name "veyrang-bot"
          git config user.email "bot@veyrang.com"
          git add 'app/api/[[...route]]/route.ts'
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix(build): restore verifyToken + JWT_SECRET/ADMIN env constants (compile error)"
          git push origin HEAD:main
