name: restore-cache-plan
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Apply LKG + normalized menu wiring on main
        run: |
          set -e
          python3 scripts/apply_lkg_policy.py
          if [ -f scripts/apply_normalized_menu.py ]; then python3 scripts/apply_normalized_menu.py; fi
          if [ -f scripts/apply_seo_menu.py ]; then python3 scripts/apply_seo_menu.py; fi
      - name: Commit on main
        run: |
          set -e
          git config user.name "veyrang-bot"
          git config user.email "bot@veyrang.com"
          git add lib/siteDataSnapshot.ts 'app/api/[[...route]]/route.ts' 'app/restaurants/[id]/page.tsx' || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(snapshot): LKG is last successful D1 read; menus from menu_items on main"
          git push origin HEAD:main
