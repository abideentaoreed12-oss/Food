name: restore-cache-plan
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Apply LKG public serve on main
        run: |
          set -e
          python3 scripts/apply_lkg_serve_public.py
      - name: Commit on main
        run: |
          set -e
          git config user.name "veyrang-bot"
          git config user.email "bot@veyrang.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "feat(lkg): public catalogue served from last-known-good; D1 refresh every 10s"
          git push origin HEAD:main
