name: restore-cache-plan
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Harden LKG on main
        run: python3 scripts/apply_lkg_harden.py
      - name: Commit on main
        run: |
          set -e
          git config user.name "veyrang-bot"
          git config user.email "bot@veyrang.com"
          git add lib/siteDataSnapshot.ts lib/restaurantMenu.ts
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix(lkg): cold-start bootstrap await; sync timestamps on load; drop empty menu categories"
          git push origin HEAD:main
