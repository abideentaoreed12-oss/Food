name: restore-delivery-context
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Restore api and apply restaurant ops
        run: |
          bash scripts/restore_api_and_ops.sh
      - name: Commit
        run: |
          set -e
          git config user.name veyrang-bot
          git config user.email bot@veyrang.com
          git add -A
          if git diff --cached --quiet; then echo none; exit 0; fi
          git commit -m "fix: restore api.ts; restaurant live D1 menu/order routes"
          git push origin HEAD:main
