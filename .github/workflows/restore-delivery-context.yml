name: restore-delivery-context
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Apply kitchen final on main
        run: python3 scripts/apply_kitchen_final.py
      - name: Commit on main
        run: |
          set -e
          git config user.name "veyrang-bot"
          git config user.email "bot@veyrang.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix(kitchen): auth categories/addons; restaurant DELETE menu; readable add-dish form on portal"
          git push origin HEAD:main
