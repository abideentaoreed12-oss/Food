name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This repository currently has no committed npm lockfile, so npm ci cannot run.
      # Use npm install until a reviewed package-lock.json is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build
        env:
          # Build must not require real secrets; provide placeholders for compile only
          JWT_SECRET: ci-build-placeholder-not-for-production
          NODE_ENV: production
