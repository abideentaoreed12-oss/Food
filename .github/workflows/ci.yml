name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build must not require real secrets; provide placeholders for compile only
          JWT_SECRET: ci-build-placeholder-not-for-production
          NODE_ENV: production
