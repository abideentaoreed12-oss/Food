name: restore-auth-route-fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trigger-restore-auth.txt'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Run fix script
        run: |
          set -euo pipefail
          python3 scripts/fix_hardcoded_admin_login.py
          test "$(wc -c < 'app/api/[[...route]]/route.ts')" -gt 50000
          git config user.name "veyrang-bot"
          git config user.email "bot@veyrang.com"
          git add 'app/api/[[...route]]/route.ts'
          if git diff --staged --quiet; then
            echo No changes
            exit 0
          fi
          git commit -m "fix(auth): remove hardcoded admin passwords from login"
          git push
