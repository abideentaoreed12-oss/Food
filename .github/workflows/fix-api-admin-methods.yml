name: fix-api-admin-methods

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject missing admin methods
        run: python3 scripts/inject_admin_methods.py

      - name: Commit and push
        run: |
          git config user.name "veyrang-bot"
          git config user.email "bot@veyrang.com"
          git add src/services/api.ts
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(api): add missing admin methods (createStaff, deleteUser, ...)"
          git push
