name: fix-api-admin-methods

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Align api signatures with AdminPortal
        run: python3 scripts/fix_api_signatures.py

      - name: Commit and push once
        run: |
          git config user.name "veyrang-bot"
          git config user.email "bot@veyrang.com"
          git add src/services/api.ts
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(api): align updateCMS(key,value) + ensure AdminPortal methods"
          git push
